name: Test and deploy inventory
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inventory-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run check
  deploy:
    needs: test
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_DATABASE_ID != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Validate deployment settings
        run: node scripts/configure-deploy.mjs
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.generated.json
      - name: Deploy application
        run: npx wrangler deploy --config wrangler.generated.json
