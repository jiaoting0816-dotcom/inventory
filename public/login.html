<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 周边小仓库</title><link rel="stylesheet" href="/style.css"><style>body{min-height:100dvh;display:grid;place-items:center;padding:22px}.login{background:white;border:1px solid #dce4d4;border-radius:20px;width:100%;max-width:420px;padding:28px}.login h1{font-size:26px}.login p{line-height:1.8;color:#728368}.login form{display:grid;gap:16px}.login a{color:#28634e}.login input{width:100%}.login .tabs{display:flex;gap:10px;margin:20px 0}.login .tabs button{flex:1}.login small{display:block;color:#7e8a7b;line-height:1.7;margin-top:20px}[hidden]{display:none!important}#message{color:#b24236}</style><body><section class="login"><div class="eyebrow">MY COLLECTION</div><h1>周边小仓库</h1><p id="intro">自己的账号，自己的收藏账本。<br>记录保存在云端，手机和电脑都能使用。</p><div class="tabs"><button id="loginTab" class="primary">登录</button><button id="registerTab">邀请码注册</button></div><form id="authForm"><label id="setupLabel" hidden>管理员初始化密钥<input name="setupToken" type="password" autocomplete="off"></label><label id="inviteLabel" hidden>邀请码<input name="invite" autocomplete="off" maxlength="64"></label><label>用户名<input name="username" required pattern="[a-zA-Z0-9_]{3,32}" autocomplete="username" placeholder="3–32位英文、数字或下划线"></label><label>密码<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="current-password" placeholder="至少10个字符"></label><label id="confirmLabel" hidden>确认密码<input name="confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password"></label><p id="message" role="alert"></p><button class="primary" id="go">登录</button></form><small>使用独立用户名和密码。请妥善保存密码；目前暂不提供邮件找回。</small></section><script src="/login.js"></script></body></html>
