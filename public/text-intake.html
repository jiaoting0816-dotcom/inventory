<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字录入 · 周边小仓库</title><link rel="stylesheet" href="/pool-center.css"><link rel="stylesheet" href="/text-intake.css"><body><header class="shell"><a href="/inventory">周边小仓库</a><a href="/pools">卡池中心</a><span id="account"></span></header><main class="shell"><h1>文字录入</h1><p>本次新增采购。盘点、补成本或更正请进入原库存详情处理。</p><p id="availability" role="status"></p><fieldset id="entry"><label>选择卡池（最多5个）<select id="pools" multiple size="4"></select></label><label>采购文字<textarea id="text" rows="5" placeholder="粘贴本次新增采购，注明系列、卡面、数量及金额范围"></textarea></label><p class="muted">点击整理将把本次文字（包含其中的来源姓名）及所选卡池名称、成员和版本发送给 DeepSeek；不发送库存、图片和历史聊天。</p><button id="organize" type="button">整理清单</button><button id="modelCheck" type="button" hidden>核查整理结果</button><button id="manual" type="button">手动添加卡面</button><section id="draft"></section><button id="preview" type="button">核对本次入库</button></fieldset><section id="feedback" role="status" aria-live="polite"></section><section id="review" hidden></section><datalist id="sources"></datalist></main><script type="module" src="/text-intake.js"></script></body></html>
