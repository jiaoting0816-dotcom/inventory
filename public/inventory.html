<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周边小仓库 · 我的收藏账本</title><link rel="stylesheet" href="/style.css"><body><aside><div class="brand">▧ 周边小仓库</div><p>让每一份喜欢，都有迹可循。</p><nav><button class="active" data-view="stock">▦ 我的库存</button><button data-view="sales">↗ 售出记录</button></nav><div class="aside-bottom">独立账号 · 云端保存 · v2.1<br><a href="#" id="cloudBackup">↓ 下载完整备份</a><small>备份包含所有记录和图片</small></div></aside><main><header><div><div class="eyebrow">MY COLLECTION / 个人收藏管理</div><h1 id="heading">我的库存</h1><p>收好喜欢，也记好每一笔。</p></div><div class="actions"><button id="manage">分类管理</button><button id="bulk">批量入库</button><button class="primary" id="add">＋ 快速入库</button></div></header><section id="stats" class="stats"></section><div class="toolbar"><input id="search" placeholder="搜索名称、角色 / IP、位置、备注…" aria-label="搜索库存"><select id="category" aria-label="分类"><option value="">全部分类</option></select><select id="seriesFilter" aria-label="系列大类"><option value="">全部系列</option></select><select id="roleFilter" aria-label="角色"><option value="">全部角色</option></select><select id="status" aria-label="库存状态"><option value="">全部状态</option><option value="在库">在库</option><option value="部分售出">部分售出</option><option value="已售完">已售完</option></select><button id="export">导出 CSV</button></div><div id="list"></div><footer class="finance-only">金额单位：人民币（元） · 成本按入库批次核算 · 利润已扣登记邮费，未扣平台手续费</footer></main><dialog id="modal"><form id="form"><div class="modal-head"><h2 id="mtitle"></h2><button type="button" id="close" aria-label="关闭">✕</button></div><div id="fields"></div><p id="error" role="alert"></p><div class="modal-foot"><button type="button" id="cancel">取消</button><button class="primary" id="submit">保存入库</button></div></form></dialog><div id="toast" role="status"></div><script src="/app.js"></script><script src="/cloud.js"></script><script src="/accounts.js"></script><script src="/bulk-parser.js"></script><script src="/experience.js"></script></body></html>
